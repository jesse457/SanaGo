services:
  # --- Application ---
  frankenphp:
    container_name: sanago-octane
    image: sanago:latest
    pull_policy: never
    restart: unless-stopped
    ports:
      # Exposes the application on http://localhost:8000
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # 👇 All environment variables are now loaded from the .env file
    env_file:
      - .env
    depends_on:
      - redis
      - minio
      - mailpit
    networks:
      - app_network

  # --- Mail Testing (Mailpit) ---
  mailpit:
    image: axllent/mailpit
    container_name: mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"
    networks:
      - app_network

  # --- File Storage (MinIO) ---
  minio:
    image: minio/minio:latest
    container_name: minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - app_network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 30s
      timeout: 20s
      retries: 3

  createbuckets:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin;
      /usr/bin/mc mb myminio/sanago || true;
      /usr/bin/mc policy set download myminio/sanago;
      exit 0;
      "
    networks:
      - app_network

  # --- Cache (Redis) ---
  redis:
    image: redis:alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "6378:6379"
    volumes:
      - redis_data:/data
    networks:
      - app_network

# --- Volumes & Networks ---
volumes:
  minio_data:
  redis_data:

networks:
  app_network:
    driver: bridge
