services:
  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: sanago
      MINIO_ROOT_PASSWORD: sanago_secret
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc config host add minio http://minio:9000 sanago sanago_secret; do sleep 1; done;
      mc mb minio/sanago --ignore-existing;
      mc policy set public minio/sanago;
      "

volumes:
  minio_data:
