[program:octane]
process_name=%(program_name)s_%(process_num)02d
command=php /app/artisan octane:start --server=frankenphp --host=0.0.0.0 --port=8000 --admin-port=2019 --max-requests=1000
autostart=true
autorestart=true
user=root
redirect_stderr=true
# CHANGE: Send logs to Docker (stdout) instead of a file
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stopwaitsecs=3600

[program:worker]
process_name=%(program_name)s_%(process_num)02d
command=php /app/artisan queue:work --sleep=3 --tries=3 --max-time=3600
autostart=true
autorestart=true
user=root
numprocs=2
redirect_stderr=true
# CHANGE: Send logs to Docker (stdout) instead of a file
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stopwaitsecs=3600

[program:socket-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /app/artisan reverb:start --port=8080 --host=0.0.0.0
autostart=true
autorestart=true
user=root
numprocs=1
redirect_stderr=true
# CHANGE: Send logs to Docker (stdout) instead of a file
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stopwaitsecs=3600

[program:scheduler]
process_name=%(program_name)s_%(process_num)02d
command=php /app/artisan schedule:work
autostart=true
autorestart=true
user=root
numprocs=1
redirect_stderr=true
# CHANGE: Send logs to Docker (stdout) instead of a file
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stopwaitsecs=3600
