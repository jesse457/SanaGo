# ==============================================================================
# Docker Compose - Local Development
# ==============================================================================
# Usage: docker-compose -f docker-compose.local.yml up -d
# ==============================================================================

services:
  # --- Application (FrankenPHP + Laravel Octane) ---
  frankenphp:
    container_name: sanago-local
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Application
      - APP_NAME=SanaGo
      - APP_ENV=local
      - APP_KEY=${APP_KEY}
      - APP_DEBUG=true
      - APP_URL=http://localhost:8000

      # Database (using host PostgreSQL)
      - DB_CONNECTION=pgsql
      - DB_HOST=host.docker.internal
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE:-hms}
      - DB_USERNAME=${DB_USERNAME:-jesse}
      - DB_PASSWORD=${DB_PASSWORD:-secret}

      # Redis
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CACHE_DRIVER=redis
      - SESSION_DRIVER=redis
      - QUEUE_CONNECTION=redis

      # MinIO (S3-compatible storage)
      - FILESYSTEM_DISK=s3
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_BUCKET=sanago-local
      - AWS_USE_PATH_STYLE_ENDPOINT=true
      - AWS_ENDPOINT=http://minio:9000

      # Octane
      - OCTANE_SERVER=frankenphp
      - OCTANE_WORKERS=4

      # Logging
      - LOG_CHANNEL=stack
      - LOG_LEVEL=debug
    volumes:
      # Mount source code for hot-reload during development
      - ./:/app
      - /app/vendor
      - /app/node_modules
    depends_on:
      redis:
        condition: service_started
      minio:
        condition: service_healthy
    networks:
      - sanago_local
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/api/health" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  # --- Redis (Cache, Sessions, Queues) ---
  redis:
    image: redis:7-alpine
    container_name: sanago-redis-local
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_local_data:/data
    command: redis-server --appendonly yes
    networks:
      - sanago_local
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 3s
      retries: 3

  # --- MinIO (S3-compatible Object Storage) ---
  minio:
    image: minio/minio:latest
    container_name: sanago-minio-local
    restart: unless-stopped
    ports:
      - "9000:9000" # API
      - "9001:9001" # Console
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    volumes:
      - minio_local_data:/data
    command: server /data --console-address ":9001"
    networks:
      - sanago_local
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 30s
      timeout: 20s
      retries: 3

  # --- MinIO Bucket Creator ---
  createbuckets:
    image: minio/mc:latest
    container_name: sanago-minio-setup
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c " /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin; /usr/bin/mc mb myminio/sanago-local --ignore-existing; /usr/bin/mc anonymous set download myminio/sanago-local; exit 0; "
    networks:
      - sanago_local

  # --- Mailpit (Local Email Testing) ---
  mailpit:
    image: axllent/mailpit:latest
    container_name: sanago-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI
    networks:
      - sanago_local

# --- Volumes ---
volumes:
  redis_local_data:
    driver: local
  minio_local_data:
    driver: local

# --- Networks ---
networks:
  sanago_local:
    driver: bridge
