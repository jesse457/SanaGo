version: '3.8'

services:
  # ============================================================================
  # CORE APPLICATION
  # ============================================================================

  # --- Laravel App (FrankenPHP + Octane) ---
  app:
    image: ghcr.io/${GITHUB_REPOSITORY:-your-username/sanago-v1}:${IMAGE_TAG:-latest}
    container_name: sanago_app
    restart: unless-stopped
    environment:
      # App Config
      - APP_NAME=SanaGo
      - APP_ENV=production
      - APP_KEY=${APP_KEY}
      - APP_DEBUG=false
      - APP_URL=https://${DOMAIN:-sanago.com}

      # Database (Managed - External)
      - DB_CONNECTION=pgsql
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT:-5432}
      - DB_DATABASE=${DB_DATABASE}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_SSLMODE=${DB_SSLMODE:-require}

      # Redis (Internal)
      - REDIS_HOST=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - CACHE_DRIVER=redis
      - SESSION_DRIVER=redis
      - QUEUE_CONNECTION=redis

      # MinIO Configuration (S3 Compatible)
      - FILESYSTEM_DISK=s3
      - AWS_ACCESS_KEY_ID=${MINIO_ROOT_USER}
      - AWS_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD}
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_BUCKET=${AWS_BUCKET:-sanago-uploads}
      - AWS_ENDPOINT=http://minio:9000
      - AWS_USE_PATH_STYLE_ENDPOINT=true

      # Octane Tuning
      - OCTANE_SERVER=frankenphp
      - OCTANE_WORKERS=auto
      - OCTANE_MAX_REQUESTS=1000
    volumes:
      # Shared volume so Promtail can read the logs
      - storage_data:/app/storage
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - internal_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1G

  # --- Caddy (Reverse Proxy) ---
  caddy:
    image: caddy:2-alpine
    container_name: sanago_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - internal_net

  # --- Redis (Cache/Queue) ---
  redis:
    image: redis:7-alpine
    container_name: sanago_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - internal_net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ============================================================================
  # STORAGE SERVICES
  # ============================================================================

  # --- MinIO (Object Storage) ---
  minio:
    image: minio/minio:latest
    container_name: sanago_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    networks:
      - internal_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M

  # ============================================================================
  # OBSERVABILITY (LOGS & METRICS)
  # ============================================================================

  # --- Promtail (Sends Logs to Remote Server) ---
  promtail:
    image: grafana/promtail:latest
    container_name: sanago_promtail
    restart: unless-stopped
    volumes:
      # 1. Read Docker Container Logs
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      # 2. Read Laravel Application Logs (Shared Volume)
      - storage_data:/app/storage:ro
      # 3. Configuration
      - ./promtail-config.yml:/etc/promtail/config.yml:ro
    command: -config.file=/etc/promtail/config.yml
    networks:
      - internal_net
    deploy:
      resources:
        limits:
          memory: 128M

  # --- Node Exporter (System CPU/RAM Metrics) ---
  node-exporter:
    image: prom/node-exporter:latest
    container_name: sanago_node_exporter
    restart: unless-stopped
    # Exposed to Host so Remote Prometheus can scrape
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
    deploy:
      resources:
        limits:
          memory: 64M

  # --- cAdvisor (Docker Container Metrics) ---
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: sanago_cadvisor
    restart: unless-stopped
    # Exposed to Host so Remote Prometheus can scrape
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    devices:
       - /dev/kmsg
    deploy:
      resources:
        limits:
          memory: 256M

# ==============================================================================
# VOLUMES & NETWORKS
# ==============================================================================
volumes:
  redis_data:
  storage_data:   # Shared between App and Promtail
  minio_data:     # Persistent storage for file uploads
  caddy_data:
  caddy_config:

networks:
  internal_net:
    driver: bridge