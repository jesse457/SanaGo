version: '3.8'

services:
  # --- Application (FrankenPHP + Laravel Octane) ---
  app:
    image: ghcr.io/${GITHUB_REPOSITORY:-your-username/sanago-v1}:${IMAGE_TAG:-latest}
    container_name: sanago_app
    restart: unless-stopped
    environment:
      - APP_NAME=SanaGo
      - APP_ENV=production
      - APP_KEY=${APP_KEY}
      - APP_DEBUG=false
      - APP_URL=${APP_URL:-https://sanago.com}
      
      # Database (External Managed DB)
      - DB_CONNECTION=pgsql
      - DB_HOST=${DB_HOST}         # <--- Must be your Managed DB Endpoint (e.g., db-prod.aws.com)
      - DB_PORT=${DB_PORT:-5432}
      - DB_DATABASE=${DB_DATABASE}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      # SSL Mode is usually required for Managed DBs (AWS/DigitalOcean)
      - DB_SSLMODE=${DB_SSLMODE:-require} 

      # Redis (Internal Cache)
      - REDIS_HOST=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - CACHE_DRIVER=redis
      - SESSION_DRIVER=redis
      - QUEUE_CONNECTION=redis
      
      # Octane Tuning
      - OCTANE_SERVER=frankenphp
      - OCTANE_WORKERS=auto
      - OCTANE_MAX_REQUESTS=1000
    volumes:
      - storage_data:/app/storage
    depends_on:
      redis:
        condition: service_healthy
      # Removed 'postgres' dependency
    networks:
      - internal_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1G

  # --- Caddy (Reverse Proxy) ---
  caddy:
    image: caddy:2-alpine
    container_name: sanago_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - internal_net

  # --- Redis (Cache/Queue) ---
  # Keeping this local is usually fine (and faster) than managed Redis
  redis:
    image: redis:7-alpine
    container_name: sanago_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - internal_net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

# --- Volumes ---
volumes:
  redis_data:
  storage_data:
  caddy_data:
  caddy_config:
  # Removed postgres_data

# --- Networks ---
networks:
  internal_net:
    driver: bridge