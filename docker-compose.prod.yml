version: '3.8'

services:
  # --- Application (FrankenPHP + Laravel Octane) ---
  app:
    image: ghcr.io/your-username/sanago-v1:latest
    container_name: sanago_app
    restart: unless-stopped
    ports:
      - "3001:8000" # Host 3001 -> FrankenPHP 8000
    environment:
      - APP_NAME=SanaGo
      - APP_ENV=production
      - APP_KEY=${APP_KEY}
      - APP_URL=https://sanago.site

      # Database (Managed DB)
      - DB_CONNECTION=pgsql
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT:-5432}
      - DB_DATABASE=${DB_DATABASE}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_SSLMODE=require

      # Redis
      - REDIS_HOST=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD}

      # Filesystem (MinIO / S3)
      - FILESYSTEM_DISK=s3
      - AWS_ACCESS_KEY_ID=${MINIO_ROOT_USER}
      - AWS_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD}
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_BUCKET=sanago-storage
      - AWS_URL=https://s3.sanago.site # This will be your MinIO subdomain
      - AWS_ENDPOINT=http://minio:9000
      - AWS_USE_PATH_STYLE_ENDPOINT=true

    volumes:
      - storage_data:/app/storage
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    networks:
      - internal_net

  # --- MinIO (S3 Compatible Storage) ---
  minio:
    image: minio/minio:latest
    container_name: sanago_minio
    restart: unless-stopped
    ports:
      - "9000:9000" # API Port
      - "9001:9001" # Console Port
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - internal_net

  # --- Redis (Cache/Queue) ---
  redis:
    image: redis:7-alpine
    container_name: sanago_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - internal_net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  redis_data:
  storage_data:
  minio_data:

networks:
  internal_net:
    driver: bridge
