name: Production Deploy

on:
  push:
    branches:
      - main

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}:latest
          # Pass secrets to Dockerfile for Flux UI installation
          
      - name: Deploy to Production Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "Deploying Production..."

            # Navigate to your project folder on the server
            cd /var/www/my-app

            # Pull the latest image we just built
            docker pull ghcr.io/${{ github.repository }}:latest

            # Restart containers to use the new image
            docker compose down
            docker compose up -d --remove-orphans

            # Run Migrations
            docker compose exec -T frankenphp php artisan migrate --force

            # Clear/Optimize Caches
            docker compose exec -T frankenphp php artisan optimize
