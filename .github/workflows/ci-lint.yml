name: CI - Code Linting

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: write

jobs:
  lint:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl

      - name: Install Pint
        run: composer global require laravel/pint

      - name: Run Pint (Code Style Check)
        run: pint --test

      - name: Run Pint (Auto-fix)
        if: failure()
        run: pint

      - name: Commit Fixed Style
        if: failure()
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "style: fix code style via pint [skip ci]"
