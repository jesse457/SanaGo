name: CD - Deploy to Production

on:
  workflow_run:
    workflows: ["CD - Build & Push Docker Image"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    
    steps:
      - name: Deploy to Production Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            echo "🚀 Starting deployment to production..."

            # Navigate to project directory
            cd /var/www/my-app || exit 1

            # Pull the latest image
            echo "📦 Pulling latest Docker image..."
            docker pull ${{ env.IMAGE_NAME }}:latest

            # Stop and remove old containers
            echo "🛑 Stopping old containers..."
            docker compose down

            # Start new containers
            echo "▶️  Starting new containers..."
            docker compose up -d --remove-orphans

            # Wait for containers to be healthy
            echo "⏳ Waiting for containers to be ready..."
            sleep 10

            # Run database migrations
            echo "🗄️  Running database migrations..."
            docker compose exec -T frankenphp php artisan migrate --force

            # Clear and optimize caches
            echo "🧹 Clearing and optimizing caches..."
            docker compose exec -T frankenphp php artisan optimize:clear
            docker compose exec -T frankenphp php artisan optimize

            # Verify deployment
            echo "✅ Deployment completed successfully!"
            docker compose ps

      - name: Notify Deployment Status
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Deployment to production completed successfully"
          else
            echo "❌ Deployment to production failed"
            exit 1
          fi
