global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['monitoring-prometheus:9090']

  - job_name: 'node-exporter' # Host System Metrics
    static_configs:
      - targets: ['monitoring-node-exporter:9100']

  - job_name: 'cadvisor' # Individual Container Metrics
    static_configs:
      - targets: ['monitoring-cadvisor:8080']

  - job_name: 'loki'
    static_configs:
      - targets: ['monitoring-loki:3100']
